[tool.poetry]
name = "jageocoder-converter"
version = "2.1.2"
description = "Dictionary generator for jageocoder."
authors = ["\"Takeshi Sagara\" <sagara@info-proto.com>"]
readme = "README.md"
packages = [{include = "jageocoder_converter"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
jaconv = ">=0.3.4"
docopt = ">=0.6.2"
PortableTab = ">=0.3.5"
pyproj = ">=3.5.0"
jageocoder = ">=2.1.8"
certifi = ">=2025.1.31"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.5"
flake8 = ">=7.1.2"
twine = ">=6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
