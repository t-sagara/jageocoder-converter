[tool.poetry]
name = "jageocoder-converter"
version = "2.1.3"
description = "Dictionary generator for jageocoder."
authors = ["\"Takeshi Sagara\" <sagara@info-proto.com>"]
readme = "README.md"
packages = [{include = "jageocoder_converter"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
certifi = ">=2025.1.31"
docopt-ng = "*"
jaconv = ">=0.3.4"
pyproj = ">=3.5.0"
jageocoder = {path = "../jageocoder", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.5"
flake8 = ">=7.1.2"
twine = ">=6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
